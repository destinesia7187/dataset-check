[project]
name = "dataset-check"
version = "1.0.0"
description = "Local validation of open tabular datasets"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "budgets: real default issue limits and stress scenarios",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

