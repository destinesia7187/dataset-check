services:
  dataset-check:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATA_DIR: /app/data
      FRONTEND_DIST: /app/frontend/dist
      ALLOWED_HOSTS: localhost,127.0.0.1
      ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    volumes:
      - dataset-check-data:/app/data
    init: true
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  dataset-check-data:
